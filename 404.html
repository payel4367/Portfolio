<style>
:root{--top:#1d7ff3;--mid:#3d9bf7;--bot:#8cc6ff;--ink:#12263A;--gold:#F0B44C;--txt:#fff;--serif:"Instrument Serif",Georgia,serif;--sans:Manrope,system-ui,-apple-system,sans-serif;--mono:"DM Mono",ui-monospace,Menlo,monospace}

.top{display:flex;justify-content:space-between;align-items:center;padding:calc(20px + env(safe-area-inset-top,0px)) clamp(18px,4vw,48px) 0}

.stage{position:relative;width:100%;height:clamp(210px,27vw,400px);-webkit-mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent);mask-image:linear-gradient(transparent,#000 18%,#000 82%,transparent)}
.stage video,.stage .half,.stage .under{position:absolute;inset:0;width:100%;height:100%}
.under{opacity:0;background-size:1100% 100%;background-position:50% 50%}.cut .under{opacity:1}
.stage video{object-fit:cover;object-position:51% 50%}
.half{opacity:0;background-size:cover;background-position:51% 50%;will-change:transform}
.half.l{clip-path:inset(0 calc(100% - var(--split,51%)) 0 0);transform-origin:0 50%;-webkit-mask-image:linear-gradient(90deg,#000 calc(var(--split,51%) - 7%),transparent var(--split,51%));mask-image:linear-gradient(90deg,#000 calc(var(--split,51%) - 7%),transparent var(--split,51%))}
.half.r{clip-path:inset(0 0 0 var(--split,51%));transform-origin:100% 50%;-webkit-mask-image:linear-gradient(90deg,transparent var(--split,51%),#000 calc(var(--split,51%) + 7%));mask-image:linear-gradient(90deg,transparent var(--split,51%),#000 calc(var(--split,51%) + 7%))}
.cut .half{opacity:1}.cut video{opacity:0}
.apart .half{transition:transform 1.6s cubic-bezier(.45,0,.15,1)}
.apart .half.l{transform:translateX(calc(-1 * var(--pull,16vw))) rotate(-2.5deg)}
.apart .half.r{transform:translateX(var(--pull,16vw)) rotate(2.5deg)}

.big{position:absolute;left:var(--split,51%);top:50%;transform:translate(-50%,-50%) scale(.82);font:400 clamp(110px,21vw,300px)/.8 var(--serif);letter-spacing:-.02em;color:#fff;opacity:0;white-space:nowrap;text-shadow:0 10px 40px rgba(0,25,80,.35);pointer-events:none}

.apart .big{opacity:1;transform:translate(-50%,-50%) scale(1);transition:opacity 1s ease .55s,transform 1.4s cubic-bezier(.2,.9,.2,1) .45s}

/* copy */
.copy{text-align:center;padding:0 22px;margin-top:clamp(8px,2vh,24px);opacity:0;transform:translateY(12px)}

.copy p{margin:12px auto 0;max-width:34ch;font-size:clamp(15px,1.3vw,17px);line-height:1.55;color:rgba(255,255,255,.85)}

.btn .ic svg{width:16px;height:16px}
.btn.solid{background:#fff;color:var(--ink)}.btn.solid .ic{background:#1F6FDB;color:#fff}
.btn.ghost{border:1.5px solid rgba(255,255,255,.6);color:#fff;padding:12px 20px}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
@media (prefers-reduced-motion:reduce){.apart .half,.apart .big,.apart .copy{transition:none!important}}
</style>
</head>

<script>
(function(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  var v=document.getElementById('v'),stage=document.getElementById('stage'),m=document.getElementById('m');
  var CUT=8.2,SPLIT=51,done=false,base;
  function setArt(d,keepTime){base=d?'/handsd':'/hands';var T=base+'-tied.jpg';(new Image()).src=T;
    document.querySelectorAll('.half').forEach(function(h){h.style.backgroundImage='url('+T+')'});document.querySelector('.under').style.backgroundImage='url('+base+'-poster.jpg)';
    if(done)return;var t=keepTime?v.currentTime:0;v.poster=base+'-poster.jpg';v.innerHTML='';
    var s1=document.createElement('source');s1.src=base+'.webm';s1.type='video/webm';var s2=document.createElement('source');s2.src=base+'.mp4';s2.type='video/mp4';v.appendChild(s1);v.appendChild(s2);
    if(keepTime){v.load();try{v.currentTime=t}catch(e){}var seek=function(){if(Math.abs(v.currentTime-t)>0.3){try{v.currentTime=t}catch(e){}}};['loadedmetadata','loadeddata','canplay'].forEach(function(ev){v.addEventListener(ev,function f(){v.removeEventListener(ev,f);seek()})});var p=v.play();if(p&&p.catch)p.catch(function(){})}}
  setArt(dark,false);
  var tb=document.getElementById('tb');function lbl(){var d=document.documentElement.getAttribute('data-theme')==='dark';tb.setAttribute('aria-label',d?'Switch to light theme':'Switch to dark theme')}lbl();
  tb.addEventListener('click',function(){var d=document.documentElement.getAttribute('data-theme')!=='dark';document.documentElement.setAttribute('data-theme',d?'dark':'light');try{localStorage.setItem('pg-theme',d?'dark':'light')}catch(e){}lbl();setArt(d,true)});
  // where the cut lands on screen (the film is cropped with object-fit:cover)
  function place(){var W=stage.clientWidth,H=stage.clientHeight,vw=1440,vh=376,s=Math.max(W/vw,H/vh),rw=vw*s,ox=(W-rw)*(SPLIT/100);
    var x=(ox+rw*SPLIT/100)/W*100;stage.style.setProperty('--split',x.toFixed(2)+'%');stage.style.setProperty('--pull',Math.max(60,W*0.16)+'px')}
  place();addEventListener('resize',place);
  function cut(){if(done)return;done=true;try{v.pause()}catch(e){}
    stage.classList.add('cut');m.classList.add('cut');
    setTimeout(function(){m.classList.add('apart')},420)}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){cut();m.classList.add('apart');return}
  v.currentTime=3.6;
  function watch(){if(done)return;if(v.currentTime>=CUT){cut();return}requestAnimationFrame(watch)}
  var p=v.play();if(p&&p.catch)p.catch(function(){});
  v.addEventListener('playing',function(){requestAnimationFrame(watch)});
  v.addEventListener('ended',cut);v.addEventListener('error',cut,true);
  // if the film can't autoplay (e.g. low-power mode), still show the cut
  setTimeout(function(){if(!done&&(v.paused||v.readyState<2))cut()},2600);
  setTimeout(cut,9000);
})();
</script>
